name: 问题反馈
description: 报告个人代码资产库在使用过程中遇到的问题
title: "[问题反馈] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要提交 API Key、Token、密码、私有代码、真实代码库路径或其他敏感信息。

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 可填写安装包或 Release 页面显示的版本，例如 0.2.1。
      placeholder: 例如 0.2.1
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.6
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon（M 系列）
        - Intel
        - 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请简要说明遇到了什么问题。
      placeholder: 描述问题发生时看到的现象。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请按顺序列出能够再次出现问题的操作。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？如有错误提示，请提供脱敏后的完整文字。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选。可以添加已经脱敏的截图或其他有助于定位问题的信息。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认反馈中不包含密钥、Token、密码、私有代码或其他敏感信息。
          required: true
